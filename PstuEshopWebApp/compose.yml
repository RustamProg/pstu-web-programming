
services:
  postgres:
    image: postgres:17-alpine
    container_name: pstu-eshop-postgres
    environment:
      POSTGRES_DB: pstu-eshop-db
      POSTGRES_USER: pstu-eshop
      POSTGRES_PASSWORD: pstu-eshop_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
